<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공모주 투자 수익 관리 — 사용자 가이드</title>
  <style>
    :root { color-scheme: light; --ink: #0B2A4A; --muted: #3E5A75; --line: #D3E3F3; --link: #1F6BC0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.65; color: var(--ink); background: #F6FAFE; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .shell { width: min(720px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.25; letter-spacing: -0.025em; }
    .lede { margin: 16px 0 32px; color: var(--muted); }
    .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .choices a { display: block; padding: 24px; background: #fff; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); text-decoration: none; }
    .choices a:hover, .choices a:focus-visible { border-color: var(--link); }
    .choices strong { display: block; font-size: 1.2rem; color: var(--link); }
    .choices span { color: var(--muted); }
  </style>
</head>
<body>
  <main class="shell">
    <h1>공모주 투자 수익 관리 사용자 가이드</h1>
    <p class="lede">이용하는 화면에 맞는 가이드를 고르세요. 두 가이드는 같은 기능을 다루며, 화면 캡처와 조작 방법만 다릅니다.</p>
    <div class="choices">
      <a href="pc.html"><strong>PC에서 보기</strong><span>넓은 화면의 상단 메뉴와 표 기준으로 설명합니다.</span></a>
      <a href="mobile.html"><strong>휴대폰에서 보기</strong><span>메뉴 버튼과 카드 형태 화면 기준으로 설명합니다.</span></a>
    </div>
  </main>
</body>
</html>
