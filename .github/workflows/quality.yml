name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Run tests
        working-directory: ui
        run: pnpm run test
      - name: Lint
        working-directory: ui
        run: pnpm run lint
      - name: Typecheck
        working-directory: ui
        run: pnpm run typecheck
      - name: Check formatting
        working-directory: ui
        run: pnpm run format:check
      - name: Build
        working-directory: ui
        run: pnpm run build

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ipo_ci
          POSTGRES_USER: ipo
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ipo -d ipo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: ipo_ci
      DB_PASSWORD: ci-only-password
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/ipo_ci
      SPRING_DATASOURCE_USERNAME: ipo
      SPRING_DATASOURCE_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run backend quality checks
        working-directory: backend
        run: ./gradlew test checkstyleMain checkstyleTest spotlessCheck build --no-daemon
