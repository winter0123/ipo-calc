name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Run tests
        working-directory: ui
        run: pnpm run test
      - name: Lint
        working-directory: ui
        run: pnpm run lint
      - name: Typecheck
        working-directory: ui
        run: pnpm run typecheck
      - name: Check formatting
        working-directory: ui
        run: pnpm run format:check
      - name: Build
        working-directory: ui
        run: pnpm run build

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ipo_ci
          POSTGRES_USER: ipo
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ipo -d ipo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: ipo_ci
      DB_PASSWORD: ci-only-password
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/ipo_ci
      SPRING_DATASOURCE_USERNAME: ipo
      SPRING_DATASOURCE_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run backend quality checks
        working-directory: backend
        run: ./gradlew checkstyleMain checkstyleTest spotlessCheck build --no-daemon
      - name: Diagnose Java formatting when backend checks fail
        if: failure()
        working-directory: backend
        run: |
          ./gradlew spotlessApply --no-daemon
          git diff -- src/main/java src/test/java
      - name: Run backend sync tests
        working-directory: backend
        run: ./gradlew test --tests "com.ipocalc.ipocatalog.service.ipo.sync.*" --tests "com.ipocalc.ipocatalog.service.ipo.IpoServiceTest" --tests "com.ipocalc.ipocatalog.service.ipo.sync.opendart.DartOfferingTermsParserTest" --no-daemon

  kind-discovery-live:
    name: KIND live discovery proof (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Discover four real KIND notices without notice URLs
        working-directory: backend
        env:
          KIND_DISCOVERY_LIVE: 'true'
        run: ./gradlew test --tests "com.ipocalc.ipocatalog.service.ipo.krx.KrxListingNoticeDiscoveryLiveTest" --no-daemon --info
