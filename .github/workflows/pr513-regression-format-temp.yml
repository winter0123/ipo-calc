name: Temporary PR513 Regression Checks
on:
  push:
    branches:
      - fix/dart-rights-issue-listing-20261121
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dart-rights-issue-listing-20261121
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Format and check
        working-directory: backend
        run: ./gradlew spotlessApply checkstyleMain checkstyleTest spotlessCheck --no-daemon
      - name: Save formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/java/com/ipocalc/ipocatalog/service/ipo/sync/opendart/DartRightsIssueListingParser.java backend/src/test/java/com/ipocalc/ipocatalog/service/ipo/sync/DartRightsIssueListingServiceTest.java backend/src/test/java/com/ipocalc/ipocatalog/service/ipo/sync/opendart/DartRightsIssueListingParserTest.java
          if ! git diff --cached --quiet; then
            git commit -m "style(dart): format verified issuance regressions"
            git push origin HEAD:fix/dart-rights-issue-listing-20261121
          fi
      - name: Run rights listing regressions
        working-directory: backend
        run: ./gradlew test --tests '*DartRightsIssueListingParserTest' --tests '*DartRightsIssueListingServiceTest' --no-daemon
