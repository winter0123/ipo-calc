name: KIND Discovery Smoke

on:
  push:
    branches:
      - winter0123/automatic-kind-discovery-20261122

permissions:
  contents: read

jobs:
  live:
    name: Standalone KIND discovery validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run live KIND four-notice discovery
        working-directory: backend
        env:
          KIND_DISCOVERY_LIVE: 'true'
        run: ./gradlew test --tests "com.ipocalc.ipocatalog.service.ipo.krx.KrxListingNoticeDiscoveryLiveTest" --no-daemon --info
