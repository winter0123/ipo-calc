name: Format KIND PR Java sources (temporary)

on:
  push:
    branches:
      - winter0123/automatic-kind-discovery-20261122

permissions:
  contents: write

jobs:
  format-branch:
    if: github.repository == 'winter0123/ipo-calc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: winter0123/automatic-kind-discovery-20261122
          persist-credentials: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Normalize Java formatting using repository's own Spotless rules
        working-directory: backend
        run: ./gradlew spotlessApply --no-daemon
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Normalize touched UI files using repository's Prettier
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            src/entities/ipo/api-client.ts src/entities/ipo/index.ts \
            src/entities/ipo/listingStatus.ts src/entities/ipo/listingStatus.test.ts \
            src/pages/IpoDetailPage/KrxListingAdminPanel.tsx \
            src/pages/IpoDetailPage/KrxListingAdminPanel.test.tsx
      - name: Commit only normalized Java and UI sources to the PR branch
        run: |
          if ! git diff --quiet -- backend/src/main/java backend/src/test/java ui/src; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add backend/src/main/java backend/src/test/java ui/src
            git commit -m "style: apply repository Google Java Format rules"
            git push origin HEAD:winter0123/automatic-kind-discovery-20261122
          fi
