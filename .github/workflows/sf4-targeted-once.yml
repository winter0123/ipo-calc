name: SF4 targeted once
on:
  push:
    branches: [winter0123/sf4-source-safety-507]
    paths:
      - .github/workflows/sf4-targeted-once.yml
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ipo_ci
          POSTGRES_USER: ipo
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ipo -d ipo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: ipo_ci
      DB_PASSWORD: ci-only-password
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/ipo_ci
      SPRING_DATASOURCE_USERNAME: ipo
      SPRING_DATASOURCE_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verbose targeted daily regression
        working-directory: backend
        run: |
          cat > /tmp/sf4-test-logging.gradle <<'EOF'
          allprojects {
            tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
              testLogging {
                events 'failed'
                exceptionFormat org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
                showStandardStreams true
              }
            }
          }
          EOF
          ./gradlew -I /tmp/sf4-test-logging.gradle test --no-daemon \
            --tests "com.ipocalc.ipocatalog.service.ipo.sync.AutomaticReconciliationTest.twoConsecutiveDailySuccesses_leaveTwoDailyRowsAndOneRecoverRow"
