name: Temporary PR512 formatting
on:
  push:
    branches:
      - fix/manual-historical-listing-range-20261120
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/manual-historical-listing-range-20261120
          persist-credentials: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Format backend
        working-directory: backend
        run: ./gradlew spotlessApply --no-daemon
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Format UI
        working-directory: ui
        run: pnpm exec prettier --write src/entities/ipo/types.ts src/features/ipo-sync-now/IpoSyncNowPanel.tsx src/features/ipo-sync-now/IpoSyncNowPanel.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/java/com/ipocalc/ipocatalog/ backend/src/test/java/com/ipocalc/ipocatalog/ ui/src/entities/ipo/types.ts ui/src/features/ipo-sync-now/IpoSyncNowPanel.tsx ui/src/features/ipo-sync-now/IpoSyncNowPanel.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(ipo): format listing failure and conflict reporting"
            git push origin HEAD:fix/manual-historical-listing-range-20261120
          fi
