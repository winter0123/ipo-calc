name: Temporary PR513 Targeted Checks
on:
  push:
    branches:
      - fix/dart-rights-issue-listing-20261121
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dart-rights-issue-listing-20261121
          persist-credentials: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Format
        working-directory: backend
        run: ./gradlew spotlessApply --no-daemon
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/java/com/ipocalc/ipocatalog/service/ipo/sync/opendart/DartRightsIssueListingParser.java
          if ! git diff --cached --quiet; then
            git commit -m "style(dart): format corrected listing label parsing"
            git push origin HEAD:fix/dart-rights-issue-listing-20261121
          fi
      - name: Run targeted regression tests
        working-directory: backend
        run: ./gradlew test --tests '*DartRightsIssueListingParserTest' --tests '*DartRightsIssueListingServiceTest' --no-daemon
