name: Temporary PR512 formatter
on:
  push:
    branches:
      - fix/manual-historical-listing-range-20261120
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/manual-historical-listing-range-20261120
          persist-credentials: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Apply Java format
        working-directory: backend
        run: ./gradlew spotlessApply --no-daemon
      - name: Commit formatted changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/java/com/ipocalc/ipocatalog/ backend/src/test/java/com/ipocalc/ipocatalog/
          if ! git diff --cached --quiet; then
            git commit -m "style(ipo): finish Java formatting for historical listing backfill"
            git push origin HEAD:fix/manual-historical-listing-range-20261120
          fi
