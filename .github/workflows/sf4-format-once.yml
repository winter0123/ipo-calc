name: SF4 format once
on:
  push:
    branches:
      - winter0123/sf4-source-safety-507
    paths:
      - .github/workflows/sf4-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Format Java
        working-directory: backend
        run: ./gradlew spotlessApply --no-daemon
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/java backend/src/test/java
          if ! git diff --cached --quiet; then
            git commit -m "style(ipo): format P1 P2 fixes (#507)"
            git push origin HEAD:winter0123/sf4-source-safety-507
          fi
