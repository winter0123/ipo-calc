name: Temporary rights issue formatter
on:
  push:
    branches:
      - fix/dart-rights-issue-listing-20261121
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dart-rights-issue-listing-20261121
          persist-credentials: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Spotless
        working-directory: backend
        run: ./gradlew spotlessApply --no-daemon
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Prettier
        working-directory: ui
        run: pnpm exec prettier --write src/entities/ipo/types.ts src/features/ipo-sync-now/IpoSyncNowPanel.tsx src/features/ipo-sync-now/IpoSyncNowPanel.test.tsx
      - name: Commit formatted changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/java backend/src/test/java ui/src/entities/ipo/types.ts ui/src/features/ipo-sync-now/IpoSyncNowPanel.tsx ui/src/features/ipo-sync-now/IpoSyncNowPanel.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(ipo): format rights issuance backfill"
            git push origin HEAD:fix/dart-rights-issue-listing-20261121
          fi
