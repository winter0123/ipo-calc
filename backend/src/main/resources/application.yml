spring:
  jackson:
    # Jackson 3 기본값(속성 알파벳 정렬)이 아닌 클래스 선언 순서로 응답 필드를 유지한다(Boot 3.x 동작).
    mapper:
      sort-properties-alphabetically: false
  application:
    name: account-authentication
  session:
    # 로그인 유지: 마지막 요청 후 30일(슬라이딩). 세션은 PostgreSQL(spring_session)에 저장돼 재시작해도 유지된다.
    # 만료 세션은 Spring Session이 매분 지운다(기본 cron). 스키마는 Flyway V27이 만든다.
    timeout: ${SESSION_TIMEOUT:30d}
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME:vibe_ai_team}
    username: vibe
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  jpa:
    # 엔티티 간 지연 로딩 연관관계가 없어 요청 끝까지 DB 연결을 잡아 둘 이유가 없다(연결 풀 효율, 기동 경고 제거).
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  sql:
    init:
      mode: never

app:
  signup:
    # OPEN: 누구나 가입, APPROVAL: 관리자 승인 뒤 로그인(기본, 비공개 운영), CLOSED: 가입 중단
    mode: ${APP_SIGNUP_MODE:APPROVAL}
  encryption:
    key: ${APP_ENCRYPTION_KEY:}
    keys: ${APP_ENCRYPTION_KEYS:}
    key-current: ${APP_ENCRYPTION_KEY_CURRENT:}
    broker-key: ${APP_ENCRYPTION_BROKER_KEY:}
    broker-keys: ${APP_ENCRYPTION_BROKER_KEYS:}
    broker-key-current: ${APP_ENCRYPTION_BROKER_KEY_CURRENT:}
    rotate-on-startup: ${APP_ENCRYPTION_ROTATE_ON_STARTUP:false}
  opendart:
    api-key: ${OPENDART_API_KEY:}
    base-url: https://opendart.fss.or.kr
  ustockplus:
    base-url: https://api.ustockplus.com
  datagokr:
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    base-url: https://apis.data.go.kr
  holiday-sync:
    enabled: true
  ipo-sync:
    enabled: true
    days-back: 90
  kis:
    base-url: https://openapi.koreainvestment.com:9443
  kiwoom:
    # 모의투자는 https://mockapi.kiwoom.com
    base-url: https://api.kiwoom.com
  ls:
    base-url: https://openapi.ls-sec.co.kr:8080
  rate-limit:
    # 로그인 없이 열려 있는 공개 조회와 로그인·가입 요청의 IP별 분당 한도(0 이하이면 모두 차단).
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    public-read-per-minute: ${APP_RATE_LIMIT_PUBLIC_READ_PER_MINUTE:120}
    auth-per-minute: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:20}
    # true로 켜야 X-Forwarded-For 첫 값을 클라이언트 IP로 쓴다(기본은 remoteAddr, 헤더 위조 방지).
    trust-forwarded-header: ${APP_RATE_LIMIT_TRUST_FORWARDED:false}

server:
  port: 8080
  servlet:
    context-path: /
    session:
      cookie:
        # 쿠키 max-age도 같은 값 — 응답마다 다시 써서 슬라이딩된다. 브라우저를 닫아도 유지.
        max-age: ${SESSION_TIMEOUT:30d}
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
