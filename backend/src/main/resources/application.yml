spring:
  application:
    name: account-authentication
  servlet:
    multipart:
      max-file-size: 5MB
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME:vibe_ai_team}
    username: vibe
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  sql:
    init:
      mode: never

app:
  remember-me:
    key: ${APP_REMEMBER_ME_KEY:}
  signup:
    # OPEN: 누구나 가입, APPROVAL: 관리자 승인 뒤 로그인(기본, 비공개 운영), CLOSED: 가입 중단
    mode: ${APP_SIGNUP_MODE:APPROVAL}
  encryption:
    key: ${APP_ENCRYPTION_KEY:}
    keys: ${APP_ENCRYPTION_KEYS:}
    key-current: ${APP_ENCRYPTION_KEY_CURRENT:}
    broker-key: ${APP_ENCRYPTION_BROKER_KEY:}
    broker-keys: ${APP_ENCRYPTION_BROKER_KEYS:}
    broker-key-current: ${APP_ENCRYPTION_BROKER_KEY_CURRENT:}
    rotate-on-startup: ${APP_ENCRYPTION_ROTATE_ON_STARTUP:false}
  opendart:
    api-key: ${OPENDART_API_KEY:}
    base-url: https://opendart.fss.or.kr
  ustockplus:
    base-url: https://api.ustockplus.com
  datagokr:
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    base-url: https://apis.data.go.kr
  holiday-sync:
    enabled: true
  ipo-sync:
    enabled: true
    days-back: 90
  kis:
    base-url: https://openapi.koreainvestment.com:9443
  rate-limit:
    # 로그인 없이 열려 있는 공개 조회와 로그인·가입 요청의 IP별 분당 한도(0 이하이면 모두 차단).
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    public-read-per-minute: ${APP_RATE_LIMIT_PUBLIC_READ_PER_MINUTE:120}
    auth-per-minute: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:20}
    # true로 켜야 X-Forwarded-For 첫 값을 클라이언트 IP로 쓴다(기본은 remoteAddr, 헤더 위조 방지).
    trust-forwarded-header: ${APP_RATE_LIMIT_TRUST_FORWARDED:false}

server:
  port: 8080
  servlet:
    context-path: /
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
