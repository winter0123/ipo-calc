spring:
  application:
    name: account-authentication
  servlet:
    multipart:
      max-file-size: 5MB
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME:vibe_ai_team}
    username: vibe
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  sql:
    init:
      mode: never

app:
  remember-me:
    key: ${APP_REMEMBER_ME_KEY:}
  encryption:
    key: ${APP_ENCRYPTION_KEY:}
    broker-key: ${APP_ENCRYPTION_BROKER_KEY:}
  opendart:
    api-key: ${OPENDART_API_KEY:}
    base-url: https://opendart.fss.or.kr
  ustockplus:
    base-url: https://api.ustockplus.com
  datagokr:
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    base-url: https://apis.data.go.kr
  holiday-sync:
    enabled: true
  ipo-sync:
    enabled: true
    days-back: 90
  kis:
    base-url: https://openapi.koreainvestment.com:9443

server:
  port: 8080
  servlet:
    context-path: /
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
