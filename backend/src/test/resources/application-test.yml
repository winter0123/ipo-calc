spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME:ipo_calc}
    username: ipo
    password: ipo_local_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  signup:
    mode: OPEN
  encryption:
    key: pQSZosg8xShWKKLtxE0Yk/fF4GOaG7DPB2fizcRDHnc=
    broker-key: DKN+EauX5IPvKhIvOAlCNtBUTmXV1rm+pY/A+IEeHIQ=
  datagokr:
    service-key: ""
    base-url: https://apis.data.go.kr
  holiday-sync:
    enabled: false
  ipo-sync:
    enabled: false
  open-price-sync:
    enabled: false
  notification:
    enabled: false
  rate-limit:
    # 한 JVM에서 여러 번 요청하는 기존 통합 테스트가 제한에 걸리지 않도록 크게 둔다.
    public-read-per-minute: 100000
    auth-per-minute: 100000

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE