spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME:vibe_ai_team}
    username: vibe
    password: vibe_local_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  signup:
    mode: OPEN
  encryption:
    key: pQSZosg8xShWKKLtxE0Yk/fF4GOaG7DPB2fizcRDHnc=
    broker-key: DKN+EauX5IPvKhIvOAlCNtBUTmXV1rm+pY/A+IEeHIQ=
  datagokr:
    service-key: ""
    base-url: https://apis.data.go.kr
  holiday-sync:
    enabled: false
  ipo-sync:
    enabled: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE