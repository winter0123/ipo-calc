# Cloudflare Tunnel(내 도메인 필요, TLS는 Cloudflare가 종료). 대시보드에서 터널의 Public hostname 서비스를 http://web:80 으로 지정한다.
# 사용: docker compose -f docker-compose.prod.yml -f docker-compose.cloudflared.yml up -d
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN 필요}
    depends_on:
      - web
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    environment:
      SITE_ADDRESS: ":80"
      TRUSTED_PROXIES: private_ranges
      # Cloudflare가 붙이는 실제 방문자 IP 헤더
      CLIENT_IP_HEADERS: CF-Connecting-IP
