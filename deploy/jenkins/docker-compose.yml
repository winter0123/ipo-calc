# 로컬 연습용 Jenkins. 4단계에서 운영 compose로 합친다.
name: vibe-ai-team
services:
  jenkins:
    build: .
    restart: unless-stopped
    # Docker Desktop(mac)의 docker.sock은 root 그룹. Linux VM에서는 DOCKER_GID=$(stat -c %g /var/run/docker.sock)
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      JENKINS_OPTS: --prefix=/jenkins
      # 로컬 경로(file:///repo) 체크오웃 허용 — 로컬 연습 전용, 운영(GitHub)에서는 제거
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      JOB_BRANCH: ${JOB_BRANCH:-main}
    env_file:
      - ../.env   # 배포용 시크릿(DB_PASSWORD 등)을 파이프라인이 환경변수로 사용
    ports:
      - "${JENKINS_PORT:-18081}:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/repo:ro   # 로컬 연습용: 호스트 저장소를 git 원본으로 사용
    networks:
      - ci-net

networks:
  ci-net:
    name: ci-net

volumes:
  jenkins_home:
    name: jenkins_jenkins_home
