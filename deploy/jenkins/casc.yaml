jenkins:
  systemMessage: "ipocalc CI"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy: loggedInUsersCanDoAnything
jobs:
  - script: >
      pipelineJob('vibe-deploy') {
        definition {
          cpsScm {
            scm {
              git {
                remote { url('file:///repo') }
                branches('*/${JOB_BRANCH:-main}')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
