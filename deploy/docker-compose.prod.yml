# 컨테이너 로그가 디스크를 채우지 않게 서비스당 30MB(10MB x 3)로 제한
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: vibe-ai-team
services:
  prod-postgres:
    image: postgres:17
    container_name: vibe-ai-team-postgres-prod
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: vibe_ai_team
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe -d vibe_ai_team"]
      interval: 5s
      retries: 10
    networks:
      prod:
        aliases:
          - postgres

  prod-backend:
    build: ../backend
    restart: unless-stopped
    container_name: vibe-ai-team-backend-prod
    logging: *logging
    # 비로그인 /auth/me 가 401이면 앱·DB·마이그레이션까지 정상(Jenkins 스모크와 같은 기준)
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://localhost:8080/auth/me 2>&1 | grep -q 'HTTP/1.1 401'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      prod-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vibe_ai_team
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      APP_SIGNUP_MODE: ${APP_SIGNUP_MODE:-APPROVAL}
      # 증권사 앱키·시크릿 암호화 키(증권사 연동 사용 시 필수, openssl rand -base64 32)
      APP_ENCRYPTION_BROKER_KEY: ${APP_ENCRYPTION_BROKER_KEY:-}
      # 공모주 일정·상세(DART) 동기화. 비면 동기화가 건너뛰어짐
      OPENDART_API_KEY: ${OPENDART_API_KEY:-}
      # 휴장일 동기화(공공데이터포털 한국천문연구원 특일 정보). 비면 기본 데이터만
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      # 웹 푸시 알림(VAPID 키, 생성: npx web-push generate-vapid-keys). 하나라도 비면 푸시 기능이 꺼진다
      APP_WEBPUSH_PUBLIC_KEY: ${APP_WEBPUSH_PUBLIC_KEY:-}
      APP_WEBPUSH_PRIVATE_KEY: ${APP_WEBPUSH_PRIVATE_KEY:-}
      APP_WEBPUSH_SUBJECT: ${APP_WEBPUSH_SUBJECT:-}
      # 앞단 Caddy가 X-Forwarded-For를 붙이고 backend는 외부에 포트를 열지 않으므로 실제 방문자 IP로 요청 제한
      APP_RATE_LIMIT_TRUST_FORWARDED: ${APP_RATE_LIMIT_TRUST_FORWARDED:-true}
    networks:
      prod:
        aliases:
          - backend

  prod-web:
    build: ../ui
    restart: unless-stopped
    container_name: vibe-ai-team-web-prod
    logging: *logging
    depends_on:
      prod-backend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
    networks:
      prod:
        aliases:
          - web

volumes:
  pgdata:
    name: vibe-prod_pgdata
  caddy_data:
    name: vibe-prod_caddy_data

# 같은 compose 프로젝트(vibe-ai-team)의 개발 DB(서비스 postgres)와 기본 네트워크를 공유하면
# 운영 backend가 호스트명 postgres로 개발 DB에 붙을 수 있다 → 운영 전용 네트워크를 따로 둔다.
# 키를 default로 쓰면 개발 compose의 default(vibe-ai-team_default)와 같은 키라서 compose가 그 네트워크를
# 지우고 다시 만들려다 실패한다(2026-10-14 Jenkins #26) → 키는 prod, 실제 이름은 기존 vibe-prod_default.
networks:
  prod:
    name: vibe-prod_default
