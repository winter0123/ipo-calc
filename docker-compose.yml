name: ipo-calc
services:
  postgres:
    image: postgres:17
    container_name: ipo-calc-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ipo_calc
      POSTGRES_USER: ipo
      POSTGRES_PASSWORD: ipo_local_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
