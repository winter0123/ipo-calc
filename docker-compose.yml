name: ipocalc
services:
  postgres:
    image: postgres:17
    container_name: ipocalc-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibe_ai_team
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe_local_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
